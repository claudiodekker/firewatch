name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }}, Laravel ${{ matrix.laravel }}, Nightwatch ${{ matrix.nightwatch }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5', '8.6']
        laravel: ['12.41.1', '13.*']
        nightwatch: ['1.30.2', '~1.30.2']
        exclude:
          # On PHP 8.6 only Pest 5 installs, and it needs Symfony 8, which Laravel 12 doesn't allow.
          - php: '8.6'
            laravel: '12.41.1'
        include:
          # Composer 2.9 refuses to resolve releases that have security advisories, and the floor has some.
          - laravel: '12.41.1'
            no-security-blocking: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: sqlite3
          coverage: pcov

      - name: Install dependencies
        env:
          COMPOSER_NO_SECURITY_BLOCKING: ${{ matrix.no-security-blocking }}
        run: composer update --prefer-dist --no-interaction --no-progress --with "laravel/framework:${{ matrix.laravel }}" --with "laravel/nightwatch:${{ matrix.nightwatch }}"

      - name: Test
        run: php -d memory_limit=-1 vendor/bin/pest --coverage

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: sqlite3
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress --with "laravel/framework:13.*" --with "laravel/nightwatch:~1.30.2"

      - name: Lint
        run: composer lint

  platform:
    name: ${{ matrix.os }}, PHP 8.5, Laravel 13.*, Nightwatch ~1.30.2
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        include:
          - os: windows-latest
            exclude-group: --exclude-group=posix

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: sqlite3, pdo_sqlite, fileinfo
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress --with "laravel/framework:13.*" --with "laravel/nightwatch:~1.30.2"

      - name: Test
        run: php vendor/bin/pest ${{ matrix.exclude-group }}

  sqlite:
    name: SQLite, ${{ matrix.role }} (${{ matrix.image }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - role: old
            image: php:8.3-cli-alpine3.18
          - role: new
            image: php:8.5-cli-alpine

    steps:
      - uses: actions/checkout@v4

      - name: Test
        run: bash .github/scripts/sqlite-suite.sh . ${{ matrix.image }} ${{ matrix.role }}

  coverage:
    name: Coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: sqlite3
          coverage: pcov

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress --with "laravel/framework:13.*" --with "laravel/nightwatch:~1.30.2"

      - name: Test with coverage
        run: php -d memory_limit=-1 vendor/bin/pest --coverage --min=90

  dev-only-install:
    name: Dev-only install
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: sqlite3
          coverage: none

      - name: Prove Firewatch is absent after composer install --no-dev
        run: bash .github/scripts/dev-only-install.sh .
