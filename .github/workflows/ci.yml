name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }}, Laravel ${{ matrix.laravel }}, Nightwatch ${{ matrix.nightwatch }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4']
        laravel: ['13.*']
        nightwatch: ['~1.30.2']
        include:
          - php: '8.3'
            laravel: '12.41.1'
            nightwatch: '~1.30.2'
            no-security-blocking: '1'
          - php: '8.6'
            laravel: '13.*'
            nightwatch: '~1.30.2'

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: sqlite3
          coverage: none

      - name: Install dependencies
        env:
          # Composer 2.9 refuses to resolve releases that have security advisories, and the floor has some.
          COMPOSER_NO_SECURITY_BLOCKING: ${{ matrix.no-security-blocking }}
        run: composer update --prefer-dist --no-interaction --no-progress --with "laravel/framework:${{ matrix.laravel }}" --with "laravel/nightwatch:${{ matrix.nightwatch }}"

      - name: Lint
        run: composer lint

      - name: Test
        run: composer test

  platform:
    name: ${{ matrix.os }}, PHP 8.4, Laravel 13.*, Nightwatch ~1.30.2
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        include:
          - os: windows-latest
            exclude-group: --exclude-group=posix

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: sqlite3, fileinfo
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress --with "laravel/framework:13.*" --with "laravel/nightwatch:~1.30.2"

      - name: Test
        run: php vendor/bin/pest ${{ matrix.exclude-group }}
